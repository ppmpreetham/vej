[package]
name = "vej"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "5bd017038495063afea85aa200fb94d6969028c3", default-features = false, features = ["std", "tui", "train", "vision", "wgpu", "fusion"] }
bert-burn = { git = "https://github.com/tracel-ai/models", package = "bert-burn", default-features = false }
serde = "1.0.229"
serde_json = {version="1.0.151", features = ["raw_value"]}
strum = "0.28.0"
strum_macros = "0.28.0"
tokenizers = {version = "0.23.2", features = ["http"]}
